version: "3"

services:
  sonarr:
    image: linuxserver/sonarr
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=100
      - TZ=Europe/Zurich
    restart: unless-stopped
    volumes:
      - sonarr_config:/config
      - /srv/dev-disk-by-uuid-eaad3822-db12-4b70-9e31-59bc10826a45/media:/data

  radarr:
    image: linuxserver/radarr
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=100
      - TZ=Europe/Zurich
    restart: unless-stopped
    volumes:
      - radarr_config:/config
      - /srv/dev-disk-by-uuid-eaad3822-db12-4b70-9e31-59bc10826a45/media:/data

  lidarr:
    image: linuxserver/lidarr
    container_name: lidarr
    environment:
      - PUID=1000
      - PGID=100
      - TZ=Europe/Zurich
    restart: unless-stopped
    volumes:
      - lidarr_config:/config
      - /srv/dev-disk-by-uuid-eaad3822-db12-4b70-9e31-59bc10826a45/media:/data

  readarr:
    image: lscr.io/linuxserver/readarr:develop
    container_name: readarr
    environment:
      - PUID=1000
      - PGID=100
      - TZ=Europe/Zurich
    volumes:
      - readarr_config:/config
      - /srv/dev-disk-by-uuid-eaad3822-db12-4b70-9e31-59bc10826a45/media:/data
    restart: unless-stopped

volumes:
  radarr_config:
  sonarr_config:
  lidarr_config:
  readarr_config:

networks:
  default:
    name: proxy
    external: true