# 📊 Widgets en haut de page (Recherche, Météo, Ressources)
# Documentation : https://gethomepage.dev/configs/widgets/

- search:
    provider: duckduckgo
    target: _blank

- openmeteo:
    label: Météo
    latitude: 46.2044
    longitude: 6.1432
    timezone: Europe/Zurich
    units: metric

- resources:
    label: Système
    cpu: true
    memory: true
    celsius: true
    disk:
      - /
      - /data
