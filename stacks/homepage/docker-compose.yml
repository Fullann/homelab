services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - HOMEPAGE_ALLOWED_HOSTS=*
    volumes:
      - ./config:/app/config
      # Montage en lecture seule pour surveiller l'état des conteneurs Docker
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Montage en lecture seule du volume RAID 5 de 12 To pour le widget de stockage
      - /srv/dev-disk-by-uuid-eaad3822-db12-4b70-9e31-59bc10826a45:/data:ro
    restart: unless-stopped

networks:
  default:
    name: proxy
    external: true
