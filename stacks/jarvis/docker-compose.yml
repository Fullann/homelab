version: "3.8"

networks:
  proxy:
    external: true

services:
  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_THREAD=6
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /root/jarvis/ollama:/root/.ollama
    # Écoute en local uniquement sur l'hôte (127.0.0.1) pour Home Assistant (mode host)
    # ou accessible via le DNS interne 'http://ollama:11434' pour les conteneurs du réseau proxy
    ports:
      - "127.0.0.1:11434:11434"
    networks:
      - proxy
    restart: unless-stopped

  open-webui:
    container_name: open-webui
    image: ghcr.io/open-webui/open-webui:main
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - RAG_EMBEDDING_ENGINE=ollama
      - RAG_EMBEDDING_MODEL=nomic-embed-text:latest
    volumes:
      - /root/jarvis/open-webui:/app/backend/data
      - /srv/dev-disk-by-uuid-eaad3822-db12-4b70-9e31-59bc10826a45/nextcloud:/mnt/nextcloud:ro
    # Port interne : 8080 (routé par Nginx Proxy Manager)
    networks:
      - proxy
    depends_on:
      - ollama
    restart: unless-stopped

  n8n:
    container_name: n8n
    image: docker.n8n.io/n8nio/n8n:latest
    environment:
      - GENERIC_TIMEZONE=Europe/Zurich
      - TZ=Europe/Zurich
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://n8n.jarvis.local/}
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
    volumes:
      - /root/jarvis/n8n:/home/node/.n8n
    # Port interne : 5678 (routé par Nginx Proxy Manager)
    networks:
      - proxy
    restart: unless-stopped
