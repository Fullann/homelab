version: '3'

services:
  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=debug
      - TZ=Europe/Zurich
    volumes:
      - jellyseerr_config:/app/config
    restart: unless-stopped
    networks:
      - default

volumes:
  jellyseerr_config:
    external:
      name: jellyseerr_jellyseerr_config

networks:
  default:
    name: proxy
    external: true