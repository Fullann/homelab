services:
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8
    container_name: recyclarr
    restart: unless-stopped
    user: 1000:1000
    environment:
      - TZ=Europe/Paris
      # Exécution automatique de la synchronisation chaque nuit à 03h00 (format cron standard)
      - CRON_SCHEDULE=0 3 * * *
    volumes:
      - ./config:/config
    networks:
      - proxy

networks:
  proxy:
    name: proxy
    external: true
